<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>C2 Panel — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   RESET
═══════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --black:   #080808;
  --dark:    #101010;
  --card:    #161616;
  --card2:   #1c1c1c;
  --green:   #00A550;
  --green2:  #007A3D;
  --green3:  #00C562;
  --gold:    #C9A227;
  --gold2:   #A07E1E;
  --red:     #E63946;
  --yellow:  #F4A261;
  --text:    #E0E0E0;
  --dim:     #888;
  --dim2:    #555;
  --border:  rgba(0,165,80,.12);
  --border2: rgba(0,165,80,.28);
  --g-glow:  rgba(0,165,80,.2);
  --mono:    'JetBrains Mono',monospace;
  --ui:      'Tajawal',sans-serif;
}

html,body{height:100%;background:var(--black);color:var(--text);font-family:var(--ui);overflow:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border2)}

/* ═══════════════════════════════════════
   LOGIN
═══════════════════════════════════════ */
#login{
  position:fixed;inset:0;z-index:999;
  background:var(--black);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;
}
.login-wrap{width:min(360px,88vw);}

.l-logo{text-align:center;margin-bottom:36px;}
.l-emblem{
  display:inline-flex;align-items:center;justify-content:center;
  width:72px;height:72px;border-radius:50%;
  background:var(--green);
  font-size:28px;margin-bottom:16px;
  box-shadow:0 0 40px var(--g-glow);
}
.l-title{font-size:22px;font-weight:700;color:#fff;letter-spacing:2px;}
.l-sub{font-size:12px;color:var(--dim);margin-top:4px;letter-spacing:1px;}

.l-card{
  background:var(--card);
  border:1px solid var(--border2);
  border-radius:16px;
  padding:28px 24px;
}
.l-label{font-size:12px;color:var(--dim);margin-bottom:8px;display:block;font-weight:500;}
.l-input-wrap{position:relative;margin-bottom:16px;}
.l-input{
  width:100%;background:#0D0D0D;
  border:1px solid var(--border2);border-radius:10px;
  color:var(--text);padding:13px 44px 13px 14px;
  font-family:var(--mono);font-size:14px;outline:none;
  transition:border-color .2s;
}
.l-input:focus{border-color:var(--green);}
.l-eye{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px;padding:4px;
}
.l-btn{
  width:100%;padding:14px;border:none;border-radius:10px;
  background:var(--green);color:#fff;
  font-family:var(--ui);font-size:15px;font-weight:700;
  cursor:pointer;transition:all .2s;letter-spacing:1px;
  margin-bottom:10px;
}
.l-btn:hover{background:var(--green3);box-shadow:0 6px 24px var(--g-glow);}
.l-demo{
  width:100%;padding:13px;border:1px solid var(--border2);border-radius:10px;
  background:transparent;color:var(--dim);
  font-family:var(--ui);font-size:14px;font-weight:500;
  cursor:pointer;transition:all .2s;letter-spacing:1px;
}
.l-demo:hover{border-color:var(--gold);color:var(--gold);}
.l-err{color:var(--red);font-size:12px;text-align:center;min-height:18px;margin-top:8px;opacity:0;transition:opacity .2s;}
.l-err.show{opacity:1;}
.l-demo-badge{
  text-align:center;margin-top:14px;
  font-size:11px;color:var(--dim2);
}

/* ═══════════════════════════════════════
   MAIN APP
═══════════════════════════════════════ */
#app{display:none;height:100%;flex-direction:column;}

/* TOP BAR */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:56px;flex-shrink:0;
  background:var(--dark);border-bottom:1px solid var(--border);
}
.tb-brand{display:flex;align-items:center;gap:10px;}
.tb-icon{
  width:32px;height:32px;border-radius:8px;background:var(--green);
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.tb-name{font-size:15px;font-weight:700;color:#fff;}
.tb-name span{color:var(--green);}

.tb-right{display:flex;align-items:center;gap:12px;}
.tb-pill{
  display:flex;align-items:center;gap:6px;
  background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:5px 12px;font-size:12px;
}
.tb-dot{width:7px;height:7px;border-radius:50%;background:var(--dim2);}
.tb-dot.on{background:var(--green);box-shadow:0 0 8px var(--green);}
.tb-dot.err{background:var(--red);}
.tb-pill span{color:var(--dim);}
.tb-pill b{color:var(--text);}

.tb-count{
  background:rgba(0,165,80,.1);border:1px solid var(--border2);
  border-radius:20px;padding:5px 12px;
  font-size:12px;color:var(--green);font-weight:600;
}

.tb-demo-badge{
  background:rgba(201,162,39,.12);border:1px solid rgba(201,162,39,.3);
  border-radius:6px;padding:3px 8px;
  font-size:10px;color:var(--gold);font-weight:600;letter-spacing:1px;
}

/* BODY */
.body{flex:1;display:flex;overflow:hidden;}

/* ═══════════════════════════════════════
   DESKTOP LEFT PANEL
═══════════════════════════════════════ */
.left-panel{
  width:280px;flex-shrink:0;
  background:var(--dark);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
}
.lp-head{
  padding:16px 16px 12px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.lp-title{font-size:11px;letter-spacing:2px;color:var(--dim);font-weight:600;}
.lp-count{
  background:rgba(0,165,80,.1);border:1px solid var(--border2);
  border-radius:10px;padding:2px 8px;font-size:11px;color:var(--green);font-weight:600;
}
.lp-search{padding:12px;border-bottom:1px solid var(--border);}
.lp-search input{
  width:100%;background:var(--card2);
  border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:8px 12px;
  font-family:var(--ui);font-size:13px;outline:none;
}
.lp-search input:focus{border-color:var(--border2);}
.lp-search input::placeholder{color:var(--dim2);}

.agent-list{flex:1;overflow-y:auto;padding:8px;}

/* AGENT ROW */
.a-row{
  display:flex;align-items:center;gap:10px;
  padding:10px 10px;margin-bottom:4px;
  border-radius:10px;border:1px solid transparent;
  cursor:pointer;transition:all .15s;
}
.a-row:hover{background:var(--card);border-color:var(--border);}
.a-row.sel{background:rgba(0,165,80,.08);border-color:var(--border2);}
.a-row.dead .a-dot{background:var(--red);box-shadow:none;animation:none;}

.a-dot{
  width:8px;height:8px;flex-shrink:0;border-radius:50%;
  background:var(--green);box-shadow:0 0 8px var(--green);
  animation:blink 2s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

.a-info{flex:1;min-width:0;}
.a-id{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.a-row.dead .a-id{color:var(--dim);}
.a-plat{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.a-idle{font-size:10px;color:var(--dim2);flex-shrink:0;}

.empty-list{
  padding:40px 16px;text-align:center;
  font-size:12px;color:var(--dim2);line-height:2;
}

/* ═══════════════════════════════════════
   RIGHT TERMINAL
═══════════════════════════════════════ */
.right-panel{flex:1;display:flex;flex-direction:column;min-width:0;}

/* no-select state */
.no-sel{
  flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
  color:var(--dim2);
}
.no-sel-icon{font-size:40px;opacity:.4;}
.no-sel-text{font-size:13px;}

/* term header */
.t-head{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 20px;background:var(--dark);
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.t-head-id{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--green);}
.t-badges{display:flex;gap:6px;flex-wrap:wrap;}
.tbadge{
  font-size:10px;padding:3px 8px;border-radius:5px;font-family:var(--mono);
  background:var(--card2);border:1px solid var(--border);color:var(--dim);
}
.tbadge.os{border-color:rgba(201,162,39,.3);color:var(--gold);}
.tbadge.cwd{border-color:rgba(0,165,80,.2);color:var(--green3);}
.tbadge.dead{border-color:rgba(230,57,70,.3);color:var(--red);}

/* output */
.t-out{
  flex:1;overflow-y:auto;padding:16px 20px;
  font-family:var(--mono);font-size:12px;line-height:1.8;
  background:var(--black);
}
.tl{display:flex;gap:10px;margin-bottom:1px;align-items:flex-start;}
.tl-ts{font-size:10px;color:var(--dim2);flex-shrink:0;margin-top:2px;}
.tl-body{flex:1;min-width:0;word-break:break-all;white-space:pre-wrap;}
.tl.cmd .tl-body{color:var(--green3);}
.tl.res .tl-body{color:var(--text);}
.tl.err .tl-body{color:var(--red);}
.tl.sys .tl-body{color:var(--gold);}

/* cmd bar */
.t-bar{
  display:flex;align-items:center;gap:10px;
  padding:12px 20px;background:var(--dark);
  border-top:1px solid var(--border);flex-shrink:0;
}
.t-prompt{font-family:var(--mono);font-size:13px;color:var(--green);flex-shrink:0;}
.t-input{
  flex:1;background:var(--card2);
  border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:10px 14px;
  font-family:var(--mono);font-size:13px;outline:none;min-width:0;
  transition:border-color .2s;
}
.t-input:focus{border-color:var(--green);}
.t-input::placeholder{color:var(--dim2);}
.t-send{
  background:var(--green);color:#fff;
  border:none;border-radius:8px;
  padding:10px 20px;font-family:var(--ui);font-size:13px;font-weight:600;
  cursor:pointer;flex-shrink:0;transition:all .2s;
}
.t-send:hover{background:var(--green3);box-shadow:0 4px 16px var(--g-glow);}

/* ═══════════════════════════════════════
   MOBILE BOTTOM NAV
═══════════════════════════════════════ */
.mob-nav{display:none;}

@media(max-width:768px){
  .left-panel{
    display:none;position:fixed;
    left:0;right:0;top:56px;
    width:100%;height:calc(100% - 56px - 56px);
    z-index:40;
  }
  .left-panel.mob-show{display:flex;}
  .right-panel{display:none;}
  .right-panel.mob-show{display:flex;}

  .mob-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    height:56px;z-index:50;
    background:var(--dark);border-top:1px solid var(--border);
  }
  .mob-tab{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;cursor:pointer;border:none;background:none;color:var(--dim);
    font-family:var(--ui);font-size:10px;font-weight:500;transition:color .15s;
  }
  .mob-tab.active{color:var(--green);}
  .mob-tab-icon{font-size:18px;}

  .body{padding-bottom:0;}
  .left-panel,.right-panel{height:calc(100dvh - 56px - 56px);}

  .t-head{padding:10px 14px;}
  .t-out{padding:12px 14px;}
  .t-bar{padding:10px 14px;}
}

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
#toasts{position:fixed;top:70px;right:20px;z-index:800;display:flex;flex-direction:column;gap:8px;}
.toast{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:10px;
  font-size:13px;font-family:var(--ui);font-weight:500;
  min-width:180px;
  animation:tin .25s ease,tout .25s ease 2.75s forwards;
}
.toast.info{background:#0E1A14;border:1px solid var(--border2);color:var(--green);}
.toast.success{background:#0E1A14;border:1px solid rgba(0,197,98,.4);color:#00C562;}
.toast.err{background:#1A0E0E;border:1px solid rgba(230,57,70,.4);color:var(--red);}
.toast.warn{background:#1A150A;border:1px solid rgba(201,162,39,.4);color:var(--gold);}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
@keyframes tout{to{opacity:0;transform:translateX(16px)}}

/* line entry */
@keyframes lin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.tl{animation:lin .12s ease forwards;}
</style>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="login">
  <div class="login-wrap">
    <div class="l-logo">
      <div class="l-emblem">⚡</div>
      <div class="l-title">C2 PANEL</div>
      <div class="l-sub">لوحة التحكم والمراقبة</div>
    </div>
    <div class="l-card">
      <label class="l-label">كلمة المرور</label>
      <div class="l-input-wrap">
        <input id="passIn" class="l-input" type="password" placeholder="••••••••" autocomplete="current-password">
        <button class="l-eye" onclick="toggleEye()">👁</button>
      </div>
      <button class="l-btn" onclick="doLogin()">دخول</button>
      <button class="l-demo" onclick="doDemo()">◈ تجربة الديمو السعودي</button>
      <div class="l-err" id="lErr">كلمة المرور غير صحيحة</div>
    </div>
    <div class="l-demo-badge">ديمو يحتوي بيانات سعودية حقيقية بدون اتصال</div>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="tb-brand">
      <div class="tb-icon">⚡</div>
      <div class="tb-name">C2<span>·</span>PANEL</div>
      <div class="tb-demo-badge" id="demoBadge" style="display:none">DEMO</div>
    </div>
    <div class="tb-right">
      <div class="tb-pill">
        <div class="tb-dot" id="wsDot"></div>
        <span>WS: </span><b id="wsLbl">—</b>
      </div>
      <div class="tb-count" id="agentBadge">0 أجهزة</div>
    </div>
  </div>

  <!-- BODY -->
  <div class="body">

    <!-- LEFT: AGENTS -->
    <div class="left-panel" id="leftPanel">
      <div class="lp-head">
        <span class="lp-title">الأجهزة المتصلة</span>
        <span class="lp-count" id="lpCount">0</span>
      </div>
      <div class="lp-search">
        <input type="text" id="searchIn" placeholder="🔍  بحث..." oninput="filterList()">
      </div>
      <div class="agent-list" id="agentList">
        <div class="empty-list" id="emptyList">لا توجد أجهزة<br>شغّل agent.py للاتصال</div>
      </div>
    </div>

    <!-- RIGHT: TERMINAL -->
    <div class="right-panel mob-show" id="rightPanel">
      <div class="no-sel" id="noSel">
        <div class="no-sel-icon">⬡</div>
        <div class="no-sel-text">اختر جهازاً من القائمة</div>
      </div>
    </div>

  </div><!-- /body -->

  <!-- MOBILE NAV -->
  <div class="mob-nav">
    <button class="mob-tab" id="tab-agents" onclick="mobTab('agents')">
      <span class="mob-tab-icon">📡</span>الأجهزة
    </button>
    <button class="mob-tab active" id="tab-terminal" onclick="mobTab('terminal')">
      <span class="mob-tab-icon">💻</span>الطرفية
    </button>
  </div>

</div><!-- /app -->

<!-- TOASTS -->
<div id="toasts"></div>

<script>
// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
let ws, isDemoMode = false, curAgent = null;
const agents={}, outputs={}, history={}, histIdx={};

// ════════════════════════════════════════
// LOGIN
// ════════════════════════════════════════
function toggleEye(){const i=document.getElementById('passIn');i.type=i.type==='password'?'text':'password';}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && document.getElementById('login').style.display!=='none') doLogin();
});

async function doLogin(){
  const p=document.getElementById('passIn').value,err=document.getElementById('lErr');
  if(!p){showErr(err,'أدخل كلمة المرور');return;}
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});
    const d=await r.json();
    if(d.ok){launch(false);}
    else{showErr(err,'كلمة المرور غير صحيحة');document.getElementById('passIn').value='';}
  }catch(e){showErr(err,'تعذر الاتصال بالخادم');}
}

function doDemo(){
  launch(true);
  loadDemoAgents();
  toast('وضع الديمو — بيانات سعودية تجريبية','warn');
}

function showErr(el,msg){el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000);}

function launch(demo){
  isDemoMode=demo;
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  if(demo){document.getElementById('demoBadge').style.display='flex';}
  else{connectWS();}
}

// ════════════════════════════════════════
// DEMO DATA — Saudi themed
// ════════════════════════════════════════
const DEMO_AGENTS=[

  {id:'SABIC-JED-WKS',info:{platform:'Ubuntu 22.04 LTS',node:'sabic-jed-wks',user:'ops_user',cwd:'/home/ops_user',pid:1842,ip:'192.168.20.17'}},

function loadDemoAgents(){
  const now=Date.now();
  DEMO_AGENTS.forEach(a=>{
    agents[a.id]={...a,lastSeen:now,dead:false};
    outputs[a.id]=(DEMO_LOGS[a.id]||[]).map(e=>({...e,ts:new Date().toLocaleTimeString('en-US',{hour12:false})}));
    history[a.id]=[];histIdx[a.id]=-1;
  });
  renderList();
  updateBadge();
  // auto-select first
  setTimeout(()=>selectAgent('ARAMCO-RYD-01'),300);
}

// ════════════════════════════════════════
// WEBSOCKET
// ════════════════════════════════════════
function connectWS(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}`);
  ws.onopen=()=>setWS(true);
  ws.onclose=()=>{setWS(false);setTimeout(connectWS,3000);};
  ws.onerror=()=>setWS(false,true);
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='init')handleInit(m);
    else if(m.type==='connected')handleConn(m);
    else if(m.type==='disconnected')handleDisco(m);
    else if(m.type==='result')handleResult(m);
    else if(m.type==='heartbeat'&&agents[m.agentId])agents[m.agentId].lastSeen=m.ts;
  };
}
function setWS(on,err){
  document.getElementById('wsLbl').textContent=on?'متصل':err?'خطأ':'مقطوع';
  const d=document.getElementById('wsDot');
  d.className='tb-dot'+(on?' on':err?' err':'');
}
function handleInit(m){m.agents.forEach(a=>regAgent(a));renderList();updateBadge();}
function handleConn(m){regAgent(m.agent);renderList();updateBadge();toast(`${m.agent.id} اتصل`,'success');}
function handleDisco(m){
  if(agents[m.agentId]){agents[m.agentId].dead=true;renderList();sysLine(m.agentId,`${m.agentId} انقطع الاتصال`);}
  updateBadge();toast(`${m.agentId} انقطع الاتصال`,'err');
}
function handleResult(m){
  const{agentId,data}=m;
  if(!outputs[agentId])return;
  if(data.error)addLine(agentId,'err',data.error);
  else addLine(agentId,'res',data.result||data.output||JSON.stringify(data));
}
function regAgent(a){
  agents[a.id]=a;
  if(!outputs[a.id])outputs[a.id]=[];
  if(!history[a.id]){history[a.id]=[];histIdx[a.id]=-1;}
}

// ════════════════════════════════════════
// AGENT LIST
// ════════════════════════════════════════
let filterQ='';
function filterList(){filterQ=document.getElementById('searchIn').value.toLowerCase();renderList();}

function renderList(){
  const list=document.getElementById('agentList'),empty=document.getElementById('emptyList');
  const entries=Object.entries(agents).filter(([id])=>!filterQ||id.toLowerCase().includes(filterQ)||(agents[id].info?.platform||'').toLowerCase().includes(filterQ));
  if(!entries.length&&!filterQ){if(!list.contains(empty)){list.innerHTML='';list.appendChild(empty);}return;}
  list.innerHTML='';
  for(const[id,a] of entries){
    const d=document.createElement('div');
    d.className='a-row'+(a.dead?' dead':'')+(curAgent===id?' sel':'');
    const idle=a.lastSeen?Math.round((Date.now()-a.lastSeen)/1000):'-';
    d.innerHTML=`
      <div class="a-dot"></div>
      <div class="a-info">
        <div class="a-id">${esc(id)}</div>
        <div class="a-plat">${esc(a.info?.platform||'unknown')}</div>
      </div>
      <div class="a-idle">${a.dead?'<span style="color:var(--red)">منقطع</span>':`${idle}s`}</div>
    `;
    d.onclick=()=>{selectAgent(id);if(window.innerWidth<=768)mobTab('terminal');};
    list.appendChild(d);
  }
}

function updateBadge(){
  const alive=Object.values(agents).filter(a=>!a.dead).length;
  const total=Object.keys(agents).length;
  document.getElementById('agentBadge').textContent=alive===total?`${alive} أجهزة`:`${alive}/${total} أجهزة`;
  document.getElementById('lpCount').textContent=alive;
}

// ════════════════════════════════════════
// TERMINAL
// ════════════════════════════════════════
function selectAgent(id){
  curAgent=id;
  renderList();
  buildTerminal(id);
}

function buildTerminal(id){
  const a=agents[id],rp=document.getElementById('rightPanel');
  rp.innerHTML=`
    <div class="t-head">
      <span class="t-head-id">${esc(id)}</span>
      <div class="t-badges">
        ${a.info?.platform?`<span class="tbadge os">${esc(a.info.platform)}</span>`:''}
        ${a.info?.user?`<span class="tbadge">${esc(a.info.user)}</span>`:''}
        ${a.info?.cwd?`<span class="tbadge cwd">${esc(a.info.cwd)}</span>`:''}
        ${a.dead?`<span class="tbadge dead">منقطع</span>`:''}
      </div>
    </div>
    <div class="t-out" id="out_${id}"></div>
    <div class="t-bar">
      <span class="t-prompt">❯</span>
      <input id="cmd_${id}" class="t-input" type="text" placeholder="أمر… (ping, ls, shell, cd, cat)" autocomplete="off" autocorrect="off" autocapitalize="off">
      <button class="t-send" onclick="sendCmd('${id}')">تنفيذ</button>
    </div>
  `;
  const out=document.getElementById(`out_${id}`);
  for(const e of(outputs[id]||[]))_appendEl(out,e.cls,e.text,e.ts);
  if(out.children.length)out.scrollTop=out.scrollHeight;

  const inp=document.getElementById(`cmd_${id}`);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){sendCmd(id);return;}
    const h=history[id]||[];
    if(e.key==='ArrowUp'){e.preventDefault();if(!h.length)return;const idx=histIdx[id]<h.length-1?histIdx[id]+1:h.length-1;histIdx[id]=idx;inp.value=h[h.length-1-idx];}
    if(e.key==='ArrowDown'){e.preventDefault();if(histIdx[id]<=0){histIdx[id]=-1;inp.value='';return;}histIdx[id]--;inp.value=h[h.length-1-histIdx[id]];}
  });
  inp.focus();
}

function sendCmd(id){
  const inp=document.getElementById(`cmd_${id}`);if(!inp)return;
  const raw=inp.value.trim();if(!raw)return;
  inp.value='';histIdx[id]=-1;
  if(!history[id])history[id]=[];
  history[id].push(raw);if(history[id].length>50)history[id].shift();
  addLine(id,'cmd','❯ '+raw);

  if(isDemoMode){runDemo(id,raw);return;}

  let type,args;
  if(raw==='ping'){type='ping';args={};}
  else if(/^ls(\s|$)/.test(raw)){type='ls';args={path:raw.slice(3).trim()||'.'};}
  else if(/^cd\s/.test(raw)){type='cd';args={path:raw.slice(3).trim()};}
  else if(/^cat\s/.test(raw)){type='read_file';args={path:raw.slice(4).trim()};}
  else{type='shell';args={cmd:raw};}

  if(ws&&ws.readyState===WebSocket.OPEN){
    ws.send(JSON.stringify({type:'exec',agentId:id,cmdType:type,args}));
  }else{addLine(id,'err','WS مقطوع — الأمر لم يُرسل');}
}

// Demo command runner
function runDemo(id,raw){
  const a=agents[id];
  setTimeout(()=>{
    const r=raw.toLowerCase().trim();
    if(r==='ping')return addLine(id,'res','pong — 7ms');
    if(r==='sysinfo'||r==='info'){
      return addLine(id,'res',
        `Platform : ${a.info?.platform||'?'}\n`+
        `Node     : ${a.info?.node||id}\n`+
        `User     : ${a.info?.user||'?'}\n`+
        `CWD      : ${a.info?.cwd||'?'}\n`+
        `IP       : ${a.info?.ip||'?'}`
      );
    }
    if(r.startsWith('ls')){
      const files={
        'ARAMCO-RYD-01': 'Desktop\nDocuments\nDownloads\noperations_q4_2026.xlsx\nsecurity_audit.pdf',
        'SABIC-JED-WKS': 'bin  config  logs  pipelines  scripts  .ssh',
        'MOI-DMM-SRV':   'System32  SysWOW64  config  drivers  Tasks',
        'NEOM-CLOUD-03': '.bashrc  .config  .ssh  deploy.sh  neom_infra/',
      };
      return addLine(id,'res',files[id]||'(فارغ)');
    }
    if(r.startsWith('shell id')||r==='id')return addLine(id,'res',`uid=0(root) gid=0(root) groups=0(root)`);
    if(r.startsWith('shell whoami')||r==='whoami')return addLine(id,'res',a.info?.user||'root');
    if(r.startsWith('shell')){
      const cmd=raw.replace(/^shell\s*/i,'');
      return addLine(id,'res',`[DEMO] $ ${cmd}\nتنفيذ ناجح ✓`);
    }
    if(r.startsWith('cd'))return addLine(id,'res',`CWD → ${raw.slice(3).trim()}`);
    if(r.startsWith('cat'))return addLine(id,'res',`[DEMO] محتوى الملف: ${raw.slice(4).trim()}\n--- محتوى تجريبي ---`);
    addLine(id,'res',`[DEMO] ${raw}: تنفيذ ناجح`);
  },350+Math.random()*200);
}

function addLine(id,cls,text,ts=null){
  const e={cls,text,ts:ts||new Date().toLocaleTimeString('en-US',{hour12:false})};
  if(!outputs[id])outputs[id]=[];
  outputs[id].push(e);
  if(curAgent===id){
    const el=document.getElementById(`out_${id}`);
    if(el){_appendEl(el,e.cls,e.text,e.ts);el.scrollTop=el.scrollHeight;}
  }
}
function sysLine(id,t){addLine(id,'sys','⬡ '+t);}
function _appendEl(el,cls,text,ts){
  const d=document.createElement('div');
  d.className=`tl ${cls}`;
  d.innerHTML=`<span class="tl-ts">${ts}</span><span class="tl-body">${esc(text)}</span>`;
  el.appendChild(d);
}

// ════════════════════════════════════════
// MOBILE TABS
// ════════════════════════════════════════
function mobTab(tab){
  const lp=document.getElementById('leftPanel'),rp=document.getElementById('rightPanel');
  const ta=document.getElementById('tab-agents'),tt=document.getElementById('tab-terminal');
  if(tab==='agents'){
    lp.classList.add('mob-show');rp.classList.remove('mob-show');
    ta.classList.add('active');tt.classList.remove('active');
  }else{
    rp.classList.add('mob-show');lp.classList.remove('mob-show');
    tt.classList.add('active');ta.classList.remove('active');
  }
}

// ════════════════════════════════════════
// TOAST
// ════════════════════════════════════════
function toast(msg,type='info'){
  const c=document.getElementById('toasts');
  const icons={info:'◈',success:'✓',err:'✕',warn:'⚠'};
  const t=document.createElement('div');
  t.className=`toast ${type}`;
  t.innerHTML=`<span>${icons[type]||'·'}</span><span>${esc(msg)}</span>`;
  c.appendChild(t);
  setTimeout(()=>t.remove(),3100);
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// refresh idle
setInterval(()=>{if(Object.keys(agents).length)renderList();},5000);
</script>
